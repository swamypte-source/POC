service:
  name: pocservice
  identifier: pocservice
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: pocmani
            type: K8sManifest
            spec:
              store:
                type: Github
                spec:
                  connectorRef: pocconnector
                  gitFetchType: Branch
                  paths:
                    - k8s/
                  branch: main
              skipResourceVersioning: false
              enableDeclarativeRollback: false
  gitOpsEnabled: false
  orgIdentifier: default
  projectIdentifier: Hackathon
