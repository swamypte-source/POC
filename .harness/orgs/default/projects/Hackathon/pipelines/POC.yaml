pipeline:
  name: POC
  identifier: POC
  projectIdentifier: Hackathon
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: pocconnector
        build: <+input>
  stages:
    - stage:
        name: pocdeploy
        identifier: pocdeploy
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: pockconnector
              namespace: hackathon-demo
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: GitClone
                  name: GitClone_1
                  identifier: GitClone_1
                  spec:
                    connectorRef: pocconnector
                    build:
                      type: branch
                      spec:
                        branch: main
              - step:
                  type: Run
                  name: Run_1
                  identifier: Run_1
                  spec:
                    connectorRef: pocdocker
                    image: python:3.11
                    shell: Sh
                    command: |-
                      echo "Source Code Downloaded"

                      pwd
                      ls -la

                      python --version
              - step:
                  type: Run
                  name: Run_2
                  identifier: Run_2
                  spec:
                    connectorRef: pocdocker
                    image: python:3.11
                    shell: Sh
                    command: |-
                      pip install -r requirements.txt

                      echo "Reading application.yaml"

                      cat architecture/application.yaml

                      echo "Executing Resilience Assessment"

                      python3 scripts/resilience_check.py

                      python3 scripts/report_generator.py

                      python3 scripts/policy_check.py

                      echo "cat reports/result.json"
    - stage:
        name: pocdeployapp
        identifier: pocdeployapp
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: pocservice
            gitBranch: main
          environment:
            environmentRef: pocenv
            gitBranch: main
            deployToAll: false
            infrastructureDefinitions:
              - identifier: pocinfra
          execution:
            steps:
              - step:
                  name: Rollout Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: loadrunner_test
        identifier: loadrunner_test
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - stepGroup:
                  name: loadrunner_test
                  identifier: loadrunner_test
                  steps:
                    - parallel:
                        - step:
                            type: ShellScript
                            name: ShellScript_3
                            identifier: ShellScript_3
                            spec:
                              shell: Bash
                              executionTarget: {}
                              source:
                                type: Inline
                                spec:
                                  script: |-
                                    NAMESPACE=resilience
                                    LABEL="app=sample-demo-app"

                                    POD=$(kubectl get pods -n "$NAMESPACE" -l "$LABEL" \
                                      -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
                                      | shuf -n 1)

                                    if [ -z "$POD" ]; then
                                      echo "No pod found."
                                      exit 1
                                    fi

                                    echo "Selected pod: $POD"
                                    kubectl delete pod "$POD" -n "$NAMESPACE"
                              environmentVariables: []
                              outputVariables: []
                            timeout: 10m
                        - step:
                            type: ShellScript
                            name: ShellScript_2
                            identifier: ShellScript_2
                            spec:
                              shell: Bash
                              executionTarget: {}
                              source:
                                type: Inline
                                spec:
                                  script: |-
                                    ssh harnesssvc@GCCHackVM

                                    "C:\Program Files (x86)\OpenText\LoadRunner\bin\Wlrun.exe" -Run -TestPath "C:\Users\GCCHackVM\Documents\Controller\scenario\Hackathon_POC.lrs"
                              environmentVariables: []
                              outputVariables: []
                            timeout: 10m
        tags: {}
