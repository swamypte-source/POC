apiVersion: autoscaling/v2
 
kind: HorizontalPodAutoscaler
 
metadata:
  name: sample-demo-app-hpa
  namespace: resilience
 
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-demo-app
 
  minReplicas: 3
  maxReplicas: 10
 
  metrics:
  - type: Resource
    resource:
      name: cpu
 
      target:
        type: Utilization
        averageUtilization: 70