apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-demo-app
  namespace: resilience
spec:
  replicas: 3
 
  selector:
    matchLabels:
      app: sample-demo-app
 
  template:
    metadata:
      labels:
        app: sample-demo-app
 
    spec:
      containers:
      - name: sample-demo-app
 
        image: gcchackthon/sample-demo-app:latest
 
        imagePullPolicy: IfNotPresent
 
        ports:
        - containerPort: 5000
 
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
 
          limits:
            cpu: "500m"
            memory: "512Mi"
 
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
 
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
